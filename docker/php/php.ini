; Set the server timezone
date.timezone = Asia/Ho_Chi_Minh

; Log errors to standard error output
log_errors = On
error_log = /dev/stderr

; Do not display errors directly in browser (good for production)
display_errors = Off

; Enable output buffering (can improve performance)
output_buffering = On

; (Optional) mbstring language setting — set to neutral default
mbstring.language = ""
